name: Build Hwush APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q hwush.zip -d project

      # Discord's SDK is too big for the web uploader, so it lives in a release tagged "sdk".
      # If that release is missing, the build still works, just without Discord.
      - name: Fetch Discord SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p project/app/libs
          gh release download sdk -p discord_partner_sdk.aar -D project/app/libs --repo "$GITHUB_REPOSITORY" || echo "No Discord SDK release found, building without it"
          ls -la project/app/libs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        working-directory: project
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hwush-APK
          path: project/app/build/outputs/apk/release/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: project/app/build/outputs/apk/release/*.apk
